name: Release e deploy

# Fluxo: merge na main -> imagem publicada -> deploy automático em staging ->
# tag vX.Y.Z -> deploy em produção, que exige aprovação no environment "production".
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: template
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy
        # Substitua pelo mecanismo da sua plataforma (kubectl, helm, aws ecs, gcloud run...).
        run: echo "Deploy da imagem ${{ needs.image.outputs.tag }} em staging"
      - name: Smoke test
        run: echo "curl -f https://staging.example.com/ready"

  deploy-production:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production # configure revisores obrigatórios neste environment
    steps:
      - name: Deploy
        run: echo "Deploy da imagem ${{ needs.image.outputs.tag }} em produção"
      - name: Smoke test
        run: echo "curl -f https://api.example.com/ready"
