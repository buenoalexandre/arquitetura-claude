name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: template

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos e testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      APP_ENV: test
      APP_LLM__PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: template/pyproject.toml
      - name: Instalar dependências
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tipos
        run: uv run mypy
      - name: Testes (offline) com cobertura
        run: uv run pytest -m "not live" --cov --cov-report=xml --cov-fail-under=80
      - name: Validação do template
        run: uv run python scripts/check_template.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: template/coverage.xml

  commits:
    name: Conventional Commits no título do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            perf
            prompt
