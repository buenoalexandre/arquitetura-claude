# Ambiente local completo. A API usa o provedor fake, a menos que o .env diga outra coisa.
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      APP_ENV: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on: [jaeger]

  # Visualização de traces em http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686", "4318:4318"]
